# F-19 gamepad bindings: Xbox layout, and VR motion controllers (WMR).
#
# This file is built into f19 as the default. To change it, copy it to
# ~/.config/f19/gamepad.cfg (or pass --gamepad FILE) and edit the copy.
#
# The game sees the gamepad as a PC joystick on the game port: answer Y to
# "Do you have a joystick?" at startup and calibrate with fire button 1.
#
# One binding per line:   [shift1|shift2] <control> <action>
# A control may have several lines; '#' starts a comment.
#
# Shift layers: a control bound to `shift1` or `shift2` is held to switch the
# key, cycle and recenter bindings to those prefixed with that shift (and
# off the unprefixed ones). Holding both reaches neither. The layer counts
# when a control is pressed: letting go of a shift mid-press changes
# nothing. Stick, look and fire-button bindings ignore the shifts.
#
# Controls (SDL names):
#   buttons   a b x y back guide start leftstick rightstick
#             leftshoulder rightshoulder dpup dpdown dpleft dpright
#             misc1 paddle1 paddle2 paddle3 paddle4 touchpad
#   axes      leftx lefty rightx righty lefttrigger righttrigger
#   half axes leftx- leftx+ lefty- lefty+ ... (- is left/up), usable as buttons;
#             the triggers work as buttons too
#
# VR motion controllers (--vr), each name after left- or right-:
#   buttons   trigger squeeze menu thumbstick (click) trackpad (click)
#             trackpad-touch
#             trackpad-up trackpad-down trackpad-left trackpad-right
#             trackpad-center (clicks in that part of the trackpad)
#   axes      thumbstick-x thumbstick-y trackpad-x trackpad-y, and their
#             halves, e.g. left-thumbstick-y-
#
# Actions:
#   stick-x, stick-y [invert]   joystick axes (full axes only)
#   look-x, look-y [invert]     look around (springs back; not in VR)
#   (Bindings from both devices add up: either can fly.)
#   button1, button2            joystick fire buttons
#   key <key>                   a keyboard key while held (repeats like a
#                               held key), with optional modifiers:
#                               shift+f1, alt+p, ctrl+x
#   cycle <key> <key> ...       each press sends the next key in turn
#   recenter                    VR: make the current head pose straight ahead
#   shift1, shift2              hold for that shift layer
#     Key names as SDL spells them: a-z 0-9 f1-f10 = - [ ] ; ' , . / \ `
#     space return backspace tab escape up down left right home end
#     pageup pagedown insert delete (aliases: enter esc pgup pgdn ins del)
#
# Settings:
#   deadzone 0.12               stick deadzone (fraction of full travel)
#   threshold 0.5               how far an axis must go to act as a button

deadzone  0.12
threshold 0.5

# The layout follows the cockpit: left-hand controls work the left screen
# (map, waypoints) and the left panel (autopilot, gear, flaps, brakes);
# right-hand controls the right screen (TrackCam, pages) and the right panel
# (ECM, bay, IR jammer, decoy, countermeasures). Shift 1 reaches the panel
# indicators, shift 2 waypoint editing and countermeasures.
# Editing a waypoint: hold shift 2, press F8 (change waypoint), then move it.

# ---- VR motion controllers
# Right hand: flight stick, cannon (button 1) and missiles (button 2).
right-thumbstick-x     stick-x
right-thumbstick-y     stick-y
right-trigger          button1
right-squeeze          button2
# Left hand: shifts and throttle.
left-trigger           shift1
left-squeeze           shift2
left-thumbstick-y-     key =          # throttle up
left-thumbstick-y+     key -          # throttle down
shift1 left-thumbstick-y-  key shift+=    # max power
shift1 left-thumbstick-y+  key shift+-    # no power
shift1 left-thumbstick-x-  key shift+x    # normal time
shift1 left-thumbstick-x+  key shift+z    # accelerated time
left-thumbstick        recenter       # recentre the headset view (also Shift+F12)
shift1 left-thumbstick key f1         # cockpit view
shift2 left-thumbstick key alt+p      # pause

# Left trackpad: map / left panel / waypoint
left-trackpad-up       key z          # zoom in
left-trackpad-down     key x          # zoom out
left-trackpad-left     key shift+pageup     # previous waypoint
left-trackpad-right    key shift+pagedown   # next waypoint
shift1 left-trackpad-up     key 7     # autopilot
shift1 left-trackpad-down   key 6     # landing gear
shift1 left-trackpad-left   key 9     # flaps
shift1 left-trackpad-right  key 0     # brakes
shift2 left-trackpad-up     key shift+up      # move waypoint
shift2 left-trackpad-down   key shift+down
shift2 left-trackpad-left   key shift+left
shift2 left-trackpad-right  key shift+right
left-menu              key f3         # left CRT: map mode
shift1 left-menu       key f7         # select waypoint
shift2 left-menu       key f8         # change waypoint

# Right trackpad: TrackCam / right panel / countermeasures
right-trackpad-up      key /          # TrackCam ahead
right-trackpad-down    key .          # TrackCam rear
right-trackpad-left    key m          # TrackCam left
right-trackpad-right   key ,          # TrackCam right
shift1 right-trackpad-up    key 4     # ECM
shift1 right-trackpad-down  key 8     # bay doors
shift1 right-trackpad-left  key 3     # IR jammer
shift1 right-trackpad-right key 5     # decoy
shift2 right-trackpad-up    key space # select ordnance
shift2 right-trackpad-left  key 1     # flare
shift2 right-trackpad-right key 2     # chaff
right-menu             cycle f4 f5 f6 f10  # right CRT: data, ordnance, damage, mission
shift1 right-menu      key f2         # HUD mode (three modes)
shift2 right-menu      key f9         # ILS
right-thumbstick       key b          # select target
shift1 right-thumbstick key n         # designate target ahead

# ---- Gamepad (Xbox layout), the same scheme: the D-pad is the left
# trackpad, Y/A/X/B (up/down/left/right) the right trackpad, Back and Start
# the left and right menu buttons. The left stick flies, so the throttle is
# on the right stick (up/down) and look-around keeps left/right only.
leftx         stick-x
lefty         stick-y
rightx        look-x
righttrigger  button1                 # cannon
rightshoulder button2                 # missiles
lefttrigger   shift1
leftshoulder  shift2
righty-       key =                   # throttle up
righty+       key -                   # throttle down
shift1 righty-  key shift+=           # max power
shift1 righty+  key shift+-           # no power
shift2 righty-  key shift+z           # accelerated time
shift2 righty+  key shift+x           # normal time
rightstick    recenter                # VR: recentre the view
shift1 rightstick key f1              # cockpit view
shift2 rightstick key alt+p           # pause
guide         recenter

dpup          key z                   # zoom in
dpdown        key x                   # zoom out
dpleft        key shift+pageup        # previous waypoint
dpright       key shift+pagedown      # next waypoint
shift1 dpup     key 7                 # autopilot
shift1 dpdown   key 6                 # landing gear
shift1 dpleft   key 9                 # flaps
shift1 dpright  key 0                 # brakes
shift2 dpup     key shift+up          # move waypoint
shift2 dpdown   key shift+down
shift2 dpleft   key shift+left
shift2 dpright  key shift+right
back          key f3                  # left CRT: map mode
shift1 back   key f7                  # select waypoint
shift2 back   key f8                  # change waypoint

y             key /                   # TrackCam ahead
a             key .                   # TrackCam rear
x             key m                   # TrackCam left
b             key ,                   # TrackCam right
shift1 y      key 4                   # ECM
shift1 a      key 8                   # bay doors
shift1 x      key 3                   # IR jammer
shift1 b      key 5                   # decoy
shift2 y      key space               # select ordnance
shift2 x      key 1                   # flare
shift2 b      key 2                   # chaff
start         cycle f4 f5 f6 f10      # right CRT: data, ordnance, damage, mission
shift1 start  key f2                  # HUD mode
shift2 start  key f9                  # ILS
leftstick     key b                   # select target
shift1 leftstick key n                # designate target ahead
