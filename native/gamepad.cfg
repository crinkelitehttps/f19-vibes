# F-19 gamepad bindings: Xbox layout, and VR motion controllers (WMR).
#
# This file is built into f19 as the default. To change it, copy it to
# ~/.config/f19/gamepad.cfg (or pass --gamepad FILE) and edit the copy.
#
# The game sees the gamepad as a PC joystick on the game port: answer Y to
# "Do you have a joystick?" at startup and calibrate with fire button 1.
#
# One binding per line:   <control> <action>
# A control may have several lines; '#' starts a comment.
#
# Controls (SDL names):
#   buttons   a b x y back guide start leftstick rightstick
#             leftshoulder rightshoulder dpup dpdown dpleft dpright
#             misc1 paddle1 paddle2 paddle3 paddle4 touchpad
#   axes      leftx lefty rightx righty lefttrigger righttrigger
#   half axes leftx- leftx+ lefty- lefty+ ... (- is left/up), usable as buttons;
#             the triggers work as buttons too
#
# VR motion controllers (--vr), each name after left- or right-:
#   buttons   trigger squeeze menu thumbstick (click) trackpad (click)
#             trackpad-touch
#             trackpad-up trackpad-down trackpad-left trackpad-right
#             trackpad-center (clicks in that part of the trackpad)
#   axes      thumbstick-x thumbstick-y trackpad-x trackpad-y, and their
#             halves, e.g. left-thumbstick-y-
#
# Actions:
#   stick-x, stick-y [invert]   joystick axes (full axes only)
#   look-x, look-y [invert]     look around (springs back; not in VR)
#   (Bindings from both devices add up: either can fly.)
#   button1, button2            joystick fire buttons
#   key <key>                   a keyboard key while held (repeats like a
#                               held key), with optional modifiers:
#                               shift+f1, alt+p, ctrl+x
#     Key names as SDL spells them: a-z 0-9 f1-f10 = - [ ] ; ' , . / \ `
#     space return backspace tab escape up down left right home end
#     pageup pagedown insert delete (aliases: enter esc pgup pgdn ins del)
#
# Settings:
#   deadzone 0.12               stick deadzone (fraction of full travel)
#   threshold 0.5               how far an axis must go to act as a button

deadzone  0.12
threshold 0.5

# Flight stick and look
leftx         stick-x
lefty         stick-y
rightx        look-x
righty        look-y

# Fire buttons (the game's own joystick buttons)
a             button1
b             button2

# Throttle: hold to keep changing
righttrigger  key =
lefttrigger   key -

# Weapons
x             key space      # select ordnance
y             key 8          # bay doors
rightstick    key b          # select target

# Defences
rightshoulder key 1          # flare
leftshoulder  key 2          # chaff
dpup          key 3          # IR jammer
dpdown        key 4          # ECM
dpleft        key 5          # decoy
dpright       key n          # designate target ahead

# Flight controls
back          key 6          # landing gear
leftstick     key 0          # brakes
start         key alt+p      # pause

# ---- VR motion controllers
# Right hand flies: thumbstick is the stick, trigger and grip fire.
right-thumbstick-x     stick-x
right-thumbstick-y     stick-y
right-trigger          button1
right-squeeze          button2
right-thumbstick       key b          # select target
right-trackpad-up      key space      # select ordnance
right-trackpad-down    key 8          # bay doors
right-trackpad-left    key n          # designate target ahead
right-trackpad-right   key f5         # ordnance display
right-menu             key alt+p      # pause

# Left hand: throttle on the thumbstick, defences and flight controls.
left-thumbstick-y-     key =          # throttle up
left-thumbstick-y+     key -          # throttle down
left-trigger           key 1          # flare
left-squeeze           key 2          # chaff
left-trackpad-up       key 3          # IR jammer
left-trackpad-down     key 4          # ECM
left-trackpad-left     key 5          # decoy
left-trackpad-right    key 6          # landing gear
left-trackpad-center   key 7          # autopilot
left-thumbstick        key 0          # brakes
left-menu              key f1         # cockpit view
